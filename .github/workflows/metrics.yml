name: Metrics terminal profile

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      language_analysis:
        description: Language analysis mode
        required: true
        default: standard
        type: choice
        options:
          - standard
          - deep

permissions:
  contents: write

concurrency:
  group: metrics-terminal-profile
  cancel-in-progress: true

jobs:
  render:
    name: Render public profile metrics
    if: github.repository == 'Hilbert-beinghappy/Hilbert-beinghappy'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Generate terminal metrics with the official image
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: metrics-renders
          committer_message: "chore: refresh profile metrics [skip ci]"
          output_action: commit
          filename: github-metrics.svg

          user: Hilbert-beinghappy
          template: terminal
          base: header, activity, community
          repositories_forks: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_indepth: ${{ github.event_name == 'schedule' && 'yes' || inputs.language_analysis == 'deep' && 'yes' || 'no' }}
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 30

          config_timezone: Asia/Shanghai
          config_animations: no
          use_prebuilt_image: no
          verify: yes
          plugins_errors_fatal: yes
          retries: 2
          retries_delay: 60
          retries_output_action: 3
          retries_delay_output_action: 60
